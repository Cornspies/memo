[package]
name = "memo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
memo-native = { path = "../crates/native" }
# The Secret Service (GNOME Keyring, KWallet) over D-Bus, as the keyring authors recommend for apps:
# keyring-core plus the one store we use. Secrets cross D-Bus encrypted (crypto-rust).
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
keyring-core = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
