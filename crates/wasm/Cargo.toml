[package]
name = "memo-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memo-core = { path = "../core", features = ["render"] }
# `crypto.getRandomValues` for keys, `Date.now` for UUIDv7.
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["js"] }
# Must match the `wasm-bindgen` CLI version exactly (see web/README.md).
wasm-bindgen = "=0.2.129"
