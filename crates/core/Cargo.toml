[package]
name = "memo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
diffy = { version = "0.5", default-features = false }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rand_chacha = "0.10"
