[workspace]
resolver = "3"
members = ["crates/android", "crates/core", "crates/server", "crates/sqlite", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Argon2 is unusably slow without optimizations; tests derive real 64 MiB keys.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The WASM build of the client core for the web app (`web/build-wasm.sh`).
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

# The Android library (`android/build-rust.sh`). Unwinding stays on: the bridge turns panics into
# errors instead of crashing the app.
[profile.android]
inherits = "release"
lto = true
codegen-units = 1
strip = true
