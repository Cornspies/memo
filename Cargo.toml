[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Argon2 is unusably slow without optimizations; tests derive real 64 MiB keys.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
